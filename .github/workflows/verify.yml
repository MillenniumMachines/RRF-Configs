on:
  pull_request:
  push:
    branches:
      - main

name: Verify Release Build
jobs:
  build-and-verify:
    name: Build and Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build all machine configurations
        run: |
          dist/release-all.sh
      - name: Verify release zips
        run: |
          dist/verify-release.sh
